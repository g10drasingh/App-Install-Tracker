name: Daily App Install Count

on:
  schedule:
    # 04:00 NPT (Nepal is UTC+5:45) = 03:15 UTC
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back

jobs:
  fetch-and-append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch install counts and append to CSV
        run: python scripts/get_installs.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add app install/review data for $(date -d yesterday +%Y-%m-%d)"
            git push
          fi
